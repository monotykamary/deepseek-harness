name: Workflow discipline

on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [master]
    paths:
      - '.github/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint GitHub Actions
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}