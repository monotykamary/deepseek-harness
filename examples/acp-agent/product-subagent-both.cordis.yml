# Add both native product providers and the same independent one-shot tool rows
# an Agent Preset may contribute. Loading the composition starts neither
# product; the scenario pins both model-visible schemas.
- id: base
  name: '@monotykamary/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: subagent-codex
            name: '@monotykamary/dsh-subagent-codex'
          - id: subagent-claude-code
            name: '@monotykamary/dsh-subagent-claude-code'
          - id: tool-subagent-codex
            name: '@monotykamary/dsh-tool-subagent'
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@monotykamary/dsh-tool-subagent'
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed
